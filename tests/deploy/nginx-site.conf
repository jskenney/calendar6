# nginx + PHP-FPM for Calendar 6 courses (a reference; tests/deploy/nginx-setup.sh uses it).
# Replace AB123 with the course's URL path and add every event type to the material list.
server {
    listen 8080;
    root /var/www/html;

    # never: names that start with a dot (.git/) and .ini files, anywhere
    location ~ /\.(?!well-known/) { deny all; }
    location ~ \.ini$ { deny all; }

    # never directly: the configuration, the material, and the software's own files
    location ~ ^/AB123/(config|pages|shared|class|lab|exam|project)(/|$) { deny all; }
    location ~ ^/AB123/calendar/(lib|tests|template)(/|$) { deny all; }

    # the endpoints; SCRIPT_FILENAME must keep the linked path (not $realpath_root)
    location ~ ^/AB123/calendar/php/[a-z]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/PHPVERSION-fpm.sock;
    }
    # no other PHP file is run or sent
    location ~ \.php$ { deny all; }
}
