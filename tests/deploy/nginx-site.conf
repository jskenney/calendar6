# nginx + PHP-FPM for Calendar 6 courses (a reference; tests/deploy/nginx-setup.sh uses it).
# Replace AB123 with the web directory's URL path (the course itself lives outside the web tree).
server {
    listen 8080;
    root /var/www/html;

    # never: names that start with a dot (.git/) and .ini files, anywhere
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.ini$ { deny all; }
    location ~* \.(php\d*|phtml?|phar|phps|pht|inc)[^a-z0-9/][^/]*$ { deny all; }
    location ~* \.(php\d*|phtml?|phar|phps|pht|inc)/ { deny all; }

    # the course (config/, the material) is outside the web tree, named by course.ini (an .ini
    # file, refused above); never directly: the software's own files, Markdown files
    location ~ ^/AB123/calendar/(lib|tests|template)(/|$) { deny all; }
    location ~* \.md$ { deny all; }

    # the endpoints; SCRIPT_FILENAME must keep the linked path (not $realpath_root)
    location ~ ^/AB123/calendar/php/[a-z]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/PHPVERSION-fpm.sock;
    }
    # no other PHP file is run or sent, in any case or spelling (M-21)
    location ~* \.(php\d*|phtml?|phar|phps|pht|inc)$ { deny all; }
}
