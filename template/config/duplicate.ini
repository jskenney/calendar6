; duplicate.ini: an event used again on other calendar slots.
; copies = source [numbered | same]
;   numbered (the default): each copy is its own event (class 5 and class 6, same material)
;   same: the calendar shows the source again ("class 5" on each of those days)
; Copies take those slots; the following events move to the next free slots.

;class_6      = class_5
;class_6..10  = class_5
;class_6,8,22 = class_5 same
;lab_7        = lab_6 same        ; a second lab day with the same material
