; duplicate.ini: an event used again on other calendar days.
; copies = source [numbered | same]
; The left side is the number that meeting would carry on the calendar.
;   numbered (the default): class_6 = class_5 makes class 6 a copy of class 5;
;     the 6th folder becomes class 7
;   same: class_6 = class_5 same shows class 5 again on that day; the next meeting
;     is the real class 6 (the 6th folder), so two days show class 5

;class_6      = class_5
;class_6..10  = class_5
;class_6,8,22 = class_5 same
;lab_7        = lab_6 same        ; a second lab day with the same material
