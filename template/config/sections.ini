; sections.ini: the course's sections (optional). Information only: there is always one
; calendar; sections say when and where each one meets, so the site can show it, and they
; give "start" / "end" in default.ini their meaning.
;
; [section number]
; meets      = days and periods, comma separated. Days: M T W R F S. Several periods on one
;              day are one meeting (R34 = periods 3 and 4 = 09:45-11:35 on a normal day).
;              Optional type per meeting: "MF1 class, T12 lab" (the default is class).
; instructor = display name(s), comma separated
; room       = building and room. One room: every meeting. Several: one per entry of "meets",
;              in order ("meets = MF4, R34" with "room = HP132, HP301": MF4 in HP132, R34 in
;              HP301).

[1121]
meets      = MF1, T12
instructor = SMITH
room       = HP111

[4345]
meets      = MF4, R34
instructor = JONES
room       = HP132, HP301

[6541]
meets      = MF6, R56
instructor = JONES
room       = HP139
