; periods.ini: the school's periods, for each period schedule.
;
; [period schedule]    one section per schedule; config.ini [course] period names the default,
;                      dates.ini switches a day to another one ("period 2_hour_delay")
; label = ...          how the schedule is named on the calendar
; <period> = HH:MM-HH:MM
; <period> = cancelled the period exists but does not meet
;                      a period that is not listed does not exist in that schedule (NA)
;
; Periods are named X, 1 ... 10. In sections.ini they are read greedily as X, 10, then single
; digits (there is no period 0, so "T910" is periods 9 and 10).

[normal]
label = Normal
X  = 06:45-07:35
1  = 07:45-08:35
2  = 08:45-09:35
3  = 09:45-10:35
4  = 10:45-11:35
5  = 13:40-14:30
6  = 14:40-15:30
7  = 12:40-13:30
8  = 07:45-09:00
9  = 09:45-11:00
10 = 13:40-14:55

