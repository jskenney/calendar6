; dates.ini: days that differ from the weekly schedule.
;
; window = what | label
;   window: YYYY-MM-DD [HH:MM] [until YYYY-MM-DD [HH:MM]]
;   what:   holiday            no events (shown as a holiday); the following events move on
;           none               no events, nothing shown
;           mon ... sun        the day follows another weekday's schedule
;           bell <schedule>    a bell schedule from periods.ini (times change, lessons do not)
;           type [HH:MM-HH:MM], ...   that day's own events
;   Several can be combined: "mon, bell early". A window with times only affects meetings that
;   start inside it. Only a whole-day cancellation moves the calendar.

[days]
2026-09-07                  = holiday            | Labor Day
2026-10-12                  = holiday            | Columbus Day
2026-10-13                  = mon                | Monday schedule
2026-11-11                  = holiday            | Veterans Day
2026-11-25 until 2026-11-27 = holiday            | Thanksgiving
;2026-12-03                 = bell 2_hour_delay  | 2-hour delay (snow)
;2026-12-04                 = holiday            | Snow day
