; auth/<username>.ini: one file per account (instructors and staff; students never log in).
; The file name is the username. Make the hash with:
;   php -r 'echo password_hash("the password", PASSWORD_DEFAULT), "\n";'
; Until it is replaced this account can not log in.

password_hash = REPLACE-WITH-A-PASSWORD-HASH
instructor    = true              ; complete access: every file, always, and <inst>
valid         = always
