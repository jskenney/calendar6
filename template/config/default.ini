; default.ini: when things become available to anonymous viewers (every student).
;
; target = when [until when]
;   target: lab (a type), lab_6 (an event), lab/lab-solution (a box of every lab),
;           lab_6/lab-solution (a box of one event), lab_6/notes.html (one file),
;           notes.html (that file in every event), page/policy (a page from paths.ini),
;           class_20..27 (a range), class_6,8,22 (a list), and v4's wildcards
;           (class_2/all, class/*, class_2/*, */homework, *)
;   when:   always | never | YYYY-MM-DD [HH:MM] | +N / -N [HH:MM] (days from the event)
;           | -monday / +monday [HH:MM] | start[-15m] | end
; The most specific target decides (a box beats an event); the later line wins; no rule means
; visible.

; always visible
class_1           = always
class/notes       = always
lab/notes         = always

; normal opening times
class             = -monday 08:00
lab               = -0
class/slides      = start-15m

; solutions a week later, at 17:00
lab/lab-solution        = +7 17:00
class/homework-solution = +7 17:00

; never
exam              = never
class/instructor  = never
lab/instructor    = never
