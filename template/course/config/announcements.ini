; announcements.ini: course-wide announcements, shown by the web front end as a banner.
;
; [identifier]   names the announcement (lower-cased: [News] and [news] are the same one). A
;                front end remembers the identifiers a visitor has dismissed, so an announcement
;                is not shown again in that browser; give a new announcement (or a changed one
;                that should be shown again) a new identifier.
; text = ...     the announcement, plain text (required; as in every .ini file, " ;" starts a
;                comment, so write "x; y" without a space before the semicolon)
; show = ...     when it is shown, as in security.ini: a date, or "from until to"
;                (optional; always when left out)
;
; [closed-2026-11-20]
; text = No class on Friday: the building is closed.
; show = 2026-11-18 until 2026-11-21 08:00
