; language.ini: the words calendar6 itself writes into pages (html.php), so a course can change
; them. Plain text (written into the page HTML-escaped). A missing key keeps its default.

[text]
lock_prompt  = Enter the code to see this section   ; the label of a <lock> section's form
lock_button  = Unlock                               ; its button
show_answer  = Show answer                          ; the summary of a <student> answer
