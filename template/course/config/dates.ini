; dates.ini: days that differ from the weekly schedule.
;
; window = what | label
;   window: YYYY-MM-DD [HH:MM] [until YYYY-MM-DD [HH:MM]]
;   what:   holiday            no events (shown as a holiday); the following events move on
;           none               no events, nothing shown
;           class, lab, ...    that day's events, whatever config.ini [schedule] says; several
;                              are allowed and are placed in the order written, each taking
;                              the next event of its type: "lab, class", "class, class, class"
;           mon ... sun        the day follows another weekday's schedule (type and sections)
;           period <schedule>  a period schedule from periods.ini (times change, lessons do not)
;   Types or a weekday (not both) can be combined with a period schedule: "mon, period early",
;   "class, lab, period 2_hour_delay". Times are only allowed with holiday or none: they cancel
;   the meetings whose first section starts inside the window.
;   Only a whole-day cancellation moves the calendar. The later line wins.

[days]
2026-09-07                  = holiday             | Labor Day
2026-10-12                  = holiday             | Columbus Day
2026-10-13                  = mon                 | Monday schedule
2026-10-14                  = lab                 | Lab day
;2026-10-15                 = lab, class          ; the next lab and the next class
;2026-10-16                 = class, class, class ; three classes in one day
;2026-10-19                 = class, lab          ; a class before the lab
2026-11-11                  = holiday             | Veterans Day
2026-11-25 until 2026-11-27 = holiday             | Thanksgiving
;2026-12-03                 = period 2_hour_delay | 2-hour delay (snow)
;2026-12-04                 = holiday             | Snow day
