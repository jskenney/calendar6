name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, server time zone ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            timezone: Pacific/Kiritimati
          - php: '8.4'
            timezone: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          ini-values: date.timezone=${{ matrix.timezone }}
          coverage: none
      - name: Syntax
        run: find lib php tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php
