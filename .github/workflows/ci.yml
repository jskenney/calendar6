name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, server time zone ${{ matrix.timezone }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            timezone: Pacific/Kiritimati
          - php: '8.4'
            timezone: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          ini-values: date.timezone=${{ matrix.timezone }}
          coverage: none
      - name: Syntax
        run: find lib php tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

  apache:
    name: Deployment (Apache + PHP-FPM, linked course)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Apache and PHP-FPM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apache2 php-fpm php-cli php-curl php-mbstring
      - name: Serve a course made from the template
        run: sudo CI=true bash tests/deploy/apache-setup.sh
      - name: Smoke test
        run: php tests/deploy/smoke.php http://localhost/AB123/ /var/www/html/AB123 smoke-test-password

  nginx:
    name: Deployment (nginx + PHP-FPM, linked course)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install nginx and PHP-FPM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx php-fpm php-cli php-curl php-mbstring
      - name: Serve a course made from the template
        run: sudo CI=true bash tests/deploy/nginx-setup.sh
      - name: Smoke test
        run: php tests/deploy/smoke.php http://localhost:8080/AB123/ /var/www/html/AB123 smoke-test-password
